[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "stackroom"
version = "0.1.0"
description = "Turn a folder of documents into a public, searchable archive."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "The Stackroom contributors" }]
keywords = [
    "foia", "archive", "journalism", "documents", "ocr", "pdf",
    "static-site", "transparency", "redaction", "search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "pytesseract>=0.3.10",
    "pillow>=10.2",
    "numpy>=1.24",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# [bin] pulls the platform binary wheel; the bare package is only the Python
# API and `python -m pagefind` fails without it.
search = ["pagefind[bin]>=1.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "reportlab>=4.1",
    # The browser suites import `playwright.sync_api` and build their own
    # fixtures on top of it (see tests/conftest.py); none of them uses a
    # pytest-playwright fixture, so the plugin would be a dependency nothing
    # calls. The browsers themselves are not pip-installable - `playwright
    # install chromium`, or point PLAYWRIGHT_BROWSERS_PATH at an existing one -
    # and every browser test skips cleanly when there is none.
    "playwright>=1.44",
]

[project.urls]
Homepage = "https://github.com/igor-vuta/stackroom"
Documentation = "https://igor-vuta.github.io/stackroom/"
Source = "https://github.com/igor-vuta/stackroom"
Issues = "https://github.com/igor-vuta/stackroom/issues"

[project.scripts]
stackroom = "stackroom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stackroom"]

[tool.hatch.build.targets.sdist]
include = ["src/stackroom", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's whole API is function calls in argument defaults.
"src/stackroom/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "browser: drives a real Chromium through Playwright. Needs a built demo site as well as the browser, and skips without either; `-m 'not browser'` is the CI job that has neither.",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
