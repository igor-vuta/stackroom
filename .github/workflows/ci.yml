# Lint, then test. Lint is a separate job that the tests depend on, so a
# formatting mistake costs one 40-second job rather than five minutes of
# matrix. Everything here is also what CONTRIBUTING.md tells a contributor to
# run locally: `ruff check .` and `pytest`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch or pull request. A new push cancels the previous run,
# which is safe here because nothing in CI publishes anything.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Colour in the logs, and no interactive prompts from pip.
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ruff needs no system dependencies and no editable install of the
      # project, so this job stays under a minute.
      - name: Install ruff
        run: pip install "ruff>=0.5"

      # --output-format=github turns each finding into an annotation on the
      # diff, so a reviewer sees it on the line rather than in a log.
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One failing version must not hide the others; the point of a matrix is
      # to find out which ones are broken, not that one of them is.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One macOS job. The Homebrew package names differ from the Debian
          # ones and that difference is exactly what needs testing; running the
          # whole matrix twice would not tell us anything more. 3.13 rather
          # than 3.10 because macos-latest is arm64, and the newest arm64
          # builds of the older interpreters are several patch releases behind.
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # poppler renders the pages (pdftoppm); tesseract reads the scans.
      # tesseract-ocr-deu is here because one test needs German data and skips
      # without it, and a silent skip is a test that stopped running.
      - name: Install poppler and tesseract (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-deu

      - name: Install poppler and tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler tesseract

      - name: Install stackroom
        run: pip install -e ".[dev]"

      # pagefind ships as a prebuilt binary per platform. The search tests skip
      # cleanly when it is absent, so a platform without a wheel should not turn
      # the whole matrix red - but we do want to know, hence the annotation.
      - name: Install pagefind
        continue-on-error: true
        run: pip install "pagefind[bin]>=1.5"

      # What the runner actually had. When a test fails only on macOS, this is
      # the first thing anybody wants to see.
      - name: What this runner has
        run: stackroom doctor

      # -ra prints the reason for every skip and xfail: on this project a skip
      # usually means a system dependency did not install, which is a CI bug
      # wearing a green tick. --tb=short keeps a failure readable without
      # scrolling; --durations catches a test that has quietly become a
      # minute long.
      - name: pytest
        run: pytest --color=yes -ra --tb=short --durations=10
